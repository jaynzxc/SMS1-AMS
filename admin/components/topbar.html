<!-- ===== TOPBAR ===== -->
<header class="h-14 border-b border-[#e5e7eb] flex items-center justify-between px-4 shrink-0 sticky top-0 z-10 bg-white/95 backdrop-blur-sm">
  <div class="flex items-center gap-3">
    <!-- Burger Menu Button -->
    <button id="burgerMenuBtn" class="text-[#6b7280] hover:text-[#111827] focus:outline-none" title="Toggle Sidebar">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    <h1 class="text-base font-bold text-[#111827]" id="pageTitle">Dashboard</h1>
  </div>

  <div class="flex items-center gap-4">
    <!-- Notification Bell -->
    <button class="relative text-[#6b7280] hover:text-[#111827]">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
      </svg>
      <span class="absolute -top-1 -right-1 w-4 h-4 min-w-4 min-h-4 bg-[#0030c2] text-white text-[9px] font-semibold rounded-full flex items-center justify-center">3</span>
    </button>

    <!-- Admin Profile -->
    <div class="flex items-center gap-2.5 cursor-pointer">
      <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zM4 20.5c0-3.59 3.58-6.5 8-6.5s8 2.91 8 6.5V21H4v-.5z"/>
        </svg>
      </div>
      <div class="hidden sm:block">
        <p class="text-xs font-bold text-[#111827] leading-tight">Admin User</p>
        <p class="text-[10px] text-[#6b7280] leading-tight">System Administrator</p>
      </div>
      <svg class="w-3.5 h-3.5 text-[#6b7280]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </div>
  </div>
</header>
