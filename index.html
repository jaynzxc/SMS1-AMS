<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Monitoring System · Login</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="assets/css/output.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen flex items-center justify-center font-inter login-page">

    <!-- Background Image -->
    <img src="assets/images/login-bg.png" alt="Login Background" class="fixed inset-0 w-full h-full object-cover -z-10" />

    <!-- Login Card -->
    <div class="w-full max-w-sm mx-4 relative z-10">
        <div class="bg-white rounded-xl shadow-2xl p-8 md:p-10">

            <!-- Logo -->
            <div class="flex justify-center mb-4">
                <div class="w-20 h-20 bg-primary flex items-center justify-center overflow-hidden">
                    <img src="assets/images/bcp-logo.png" alt="Bestlink College Logo" class="w-full h-full object-cover" />
                </div>
            </div>

            <!-- Title -->
            <div class="text-center">
                <h1 class="text-primary text-lg font-extrabold tracking-wider uppercase">
                    ATTENDANCE MONITORING SYSTEM
                </h1>
                <p class="text-text-secondary text-2xl font-semibold mt-1">
                    Sign In
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="mt-6 space-y-4">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm text-text-primary">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        class="w-full px-4 py-2.5 mt-1 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-sm"
                    />
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm text-text-primary">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        class="w-full px-4 py-2.5 mt-1 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-sm"
                    />
                </div>

                <!-- Sign In Button -->
                <button
                    type="submit"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 text-sm mt-2"
                >
                    Sign in
                </button>

            </form>

            <!-- Account Creation -->
            <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-border">
                <div class="flex items-start gap-3">
                    <!-- Lock Icon -->
                    <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center shrink-0 mt-0.5">
                        <svg class="w-5 h-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-semibold text-text-primary">
                            Account Creation
                        </p>
                        <p class="text-xs text-text-secondary mt-0.5">
                            Only the system administrator can create accounts for teacher, students and staff.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-6 pt-4 border-t border-border text-center">
                <p class="text-[10px] text-text-secondary opacity-60">
                    &copy; 2026 Bestlink College of the Philippines. All rights reserved.
                </p>
            </div>

        </div>
    </div>

</body>
</html>
