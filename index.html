<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Monitoring System · Login</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="assets/css/output.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen flex items-center justify-center font-inter login-page">

    <!-- Background Image -->
    <img src="assets/images/login-bg.png" alt="Login Background" class="fixed inset-0 w-full h-full object-cover -z-10" />

    <!-- Login Card -->
    <div class="w-full max-w-md mx-4 relative z-10">
        <div class="bg-white rounded-xl shadow-2xl p-8 md:p-10">

            <!-- Logo -->
            <div class="flex justify-center mb-4">
                <div class="w-15 h-15 flex items-center justify-center overflow-hidden">
                    <img src="assets/images/bcp-logo.png" alt="Bestlink College Logo" class="w-full h-full object-cover" />
                </div>
            </div>

            <!-- Title -->
            <div class="text-center">
                <h1 class="text-sm font-bold tracking-wider uppercase">
                    ATTENDANCE MONITORING SYSTEM
                </h1>
                <p class="text-3xl font-extrabold mt-10">
                    Sign In
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="mt-3 space-y-4">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm text-[#111827] ml-[calc((100%-16rem)/2)] sm:ml-[calc((100%-18rem)/2)] md:ml-[calc((100%-20rem)/2)]">
                        Username
                    </label>
                    <div class="flex justify-center mt-1">
                        <div class="relative w-64 sm:w-72 md:w-80">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#6b7280]">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                class="w-full pl-9 pr-4 py-2.5 border border-[#e5e7eb] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0030c2] focus:border-transparent transition-all text-sm"
                            />
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm text-[#111827] ml-[calc((100%-16rem)/2)] sm:ml-[calc((100%-18rem)/2)] md:ml-[calc((100%-20rem)/2)]">
                        Password
                    </label>
                    <div class="flex justify-center mt-1">
                        <div class="relative w-64 sm:w-72 md:w-80">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#6b7280]">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                class="w-full pl-9 pr-10 py-2.5 border border-[#e5e7eb] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0030c2] focus:border-transparent transition-all text-sm"
                            />
                            <!-- Eye Icon Button -->
                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#6b7280] hover:text-[#111827] transition-colors"
                            >
                                <!-- Open Eye (default) -->
                                <svg id="eyeOpen" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <!-- Closed Eye (hidden by default) -->
                                <svg id="eyeClosed" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Sign In Button - Center -->
                <div class="flex justify-center mt-2">
                    <button
                        type="submit"
                        class="bg-[#0030c2] hover:bg-[#002699] text-white font-semibold py-2.5 px-8 rounded-lg transition-colors duration-200 text-sm"
                    >
                        Sign in
                    </button>
                </div>

            </form>

            <!-- Account Creation - Compressed -->
            <div class="mt-6 mx-auto max-w-xs p-3 bg-gray-50 rounded-lg border border-[#e5e7eb]">
                <div class="flex items-start gap-2.5">
                    <!-- Lock Icon -->
                    <div class="w-8 h-8 rounded-full bg-[#0030c2]/10 flex items-center justify-center shrink-0 mt-0.5">
                        <svg class="w-4 h-4 text-[#0030c2]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="text-xs font-semibold text-[#111827]">
                            Account Creation
                        </p>
                        <p class="text-[10px] text-[#6b7280] mt-0.5 leading-tight">
                            Only the system administrator can create accounts for teacher, students and staff.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-6 pt-4 border-t border-[#e5e7eb] text-center">
                <p class="text-[10px] text-[#6b7280] opacity-60">
                    &copy; 2026 Bestlink College of the Philippines. All rights reserved.
                </p>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
