<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Monitoring System · Login</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS & Custom Styles -->
    <link rel="stylesheet" href="assets/css/output.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="min-h-screen flex items-center justify-center font-inter login-page relative p-4 selection:bg-blue-200">

    <!-- Background with Blue Overlay/Tint -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <img src="assets/images/login-bg.png" alt="Login Background" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-[#1e60db]/75 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-[#165ec9]/20"></div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-[460px] bg-white rounded-[28px] shadow-2xl px-8 py-9 sm:px-10 sm:py-10 relative z-10">

        <!-- Logo -->
        <div class="flex justify-center">
            <img src="assets/images/bcp-logo.png" alt="Bestlink College of the Philippines"
                class="w-14 h-14 object-contain" />
        </div>

        <!-- System Title -->
        <div class="text-center mt-4">
            <h1 class="text-xs sm:text-[13px] font-extrabold tracking-wider text-black uppercase">
                ATTENDANCE MONITORING SYSTEM
            </h1>
            <h2 class="text-3xl sm:text-[32px] font-extrabold text-black mt-8 mb-6">
                Sign In
            </h2>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4 max-w-[330px] mx-auto">

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-semibold text-gray-800 mb-1.5">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-700">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" placeholder="Enter your username"
                        autocomplete="username"
                        class="w-full bg-[#eeeeee] text-gray-800 placeholder-gray-400 pl-10 pr-4 py-2.5 text-xs sm:text-sm rounded-md border border-transparent focus:outline-none focus:bg-white focus:border-[#1a68d8] focus:ring-2 focus:ring-[#1a68d8]/20 transition-all" />
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-semibold text-gray-800 mb-1.5">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-700">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Enter you password"
                        autocomplete="current-password"
                        class="w-full bg-[#eeeeee] text-gray-800 placeholder-gray-400 pl-10 pr-10 py-2.5 text-xs sm:text-sm rounded-md border border-transparent focus:outline-none focus:bg-white focus:border-[#1a68d8] focus:ring-2 focus:ring-[#1a68d8]/20 transition-all" />
                    <!-- Eye Icon Button -->
                    <button type="button" id="togglePassword"
                        class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-700 hover:text-black transition-colors cursor-pointer"
                        aria-label="Toggle password visibility">
                        <!-- Open Eye (default) -->
                        <svg id="eyeOpen" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <!-- Closed Eye (hidden by default) -->
                        <svg id="eyeClosed" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Sign In Button & Separator Dash -->
            <div class="pt-2 flex flex-col items-center">
                <button type="submit"
                    class="w-40 bg-[#1967d2] hover:bg-[#1557b0] active:scale-[0.99] text-white font-medium py-2.5 px-4 rounded-md transition-all duration-150 text-sm shadow-sm cursor-pointer">
                    Sign in
                </button>
                <div class="w-7 h-[1.5px] bg-[#9bbef3] mt-4"></div>
            </div>

        </form>

        <!-- Account Creation Info Box -->
        <div class="mt-6 p-3.5 bg-[#eaf2fd] rounded-xl flex items-center gap-3 max-w-[330px] mx-auto">
            <!-- Lock Icon in Circle -->
            <div class="w-9 h-9 rounded-full bg-[#d7e6fc] flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-[#1967d2]" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <div class="flex-1">
                <h3 class="text-xs font-bold text-[#1967d2]">
                    Account Creation
                </h3>
                <p class="text-[10px] sm:text-[11px] text-gray-700 mt-0.5 leading-snug">
                    Only the system administrator can create accounts for teacher, students and staff.
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 sm:mt-10 text-center">
            <p class="text-[11px] text-gray-500 font-normal">
                &copy; 2026 Bestlink College of the Philippines. All rights reserved.
            </p>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="assets/js/auth.js"></script>
</body>

</html>
